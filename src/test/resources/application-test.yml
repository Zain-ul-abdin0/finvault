spring:
  datasource:
    url: jdbc:tc:postgresql:16-alpine:///finvault
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

  flyway:
    enabled: true

  cache:
    type: simple

  kafka:
    bootstrap-servers: ${spring.embedded.kafka.brokers:localhost:9092}

finvault:
  jwt:
    secret: test-secret-key-minimum-256-bits-long-for-hs256-algorithm-testing
    expiration-ms: 3600000

logging:
  level:
    com.finvault: DEBUG
    org.springframework.kafka: WARN
